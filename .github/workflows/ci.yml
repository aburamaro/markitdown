name: CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  # CI実行ログをGitHub CLIで読み取るために必要
  actions: read
  # リポジトリをcheckoutし、プロンプトファイルを読み込むために必要
  contents: read
  # actions/ai-inferenceをGITHUB_TOKENで利用するために必要
  copilot-requests: write

jobs:
  # Pythonによるコードチェック、フォーマットチェック、型チェック、ユニットテストを実行するジョブ
  python-check:
    name: Python Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Unit test
        run: pytest

  # DockerfileのLint、ビルド、起動テストを実行するジョブ
  docker-check:
    name: Docker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: .devcontainer/Dockerfile
          failure-threshold: error

      - name: Build Docker image
        run: docker build -t markitdown-ci -f .devcontainer/Dockerfile .

      - name: Smoke test Docker image
        run: docker run --rm markitdown-ci python src/main.py --help

  # Gitleaksを使用して秘密情報のスキャンを実行するジョブ
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # コミット履歴全体をフェッチ

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CIの結果をJob Summaryに出力し、失敗時はAIで原因と修正案を要約するジョブ
  ai-summary:
    name: AI Summary
    runs-on: ubuntu-latest
    needs:
      - python-check
      - docker-check
      - secret-scan
    if: ${{ always() }}

    steps:
      # すべてのCIジョブが成功した場合は、AI解析を行わず成功メッセージだけを出力
      - name: Write success summary
        if: ${{ needs.python-check.result == 'success' && needs.docker-check.result == 'success' && needs.secret-scan.result == 'success' }}
        run: |
          {
            echo "## CI Result"
            echo ""
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Result: success"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo ""
            echo "All CI checks passed successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      # 外部fork由来のPRではAI解析を行わず、スキップ理由だけを出力
      - name: Write skipped summary for external pull requests
        if: ${{ (needs.python-check.result != 'success' || needs.docker-check.result != 'success' || needs.secret-scan.result != 'success') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          {
            echo "## CI Result"
            echo ""
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Result: failure"
            echo "- Branch: ${{ github.head_ref }}"
            echo "- Commit: ${{ github.event.pull_request.head.sha }}"
            echo ""
            echo "AI failure analysis was skipped because the workflow run came from an external repository."
          } >> "$GITHUB_STEP_SUMMARY"

      # CI失敗時にAIへ渡すプロンプトファイルを使うため、現在のソースコードをcheckout
      - name: Checkout repository for prompt file
        if: ${{ (needs.python-check.result != 'success' || needs.docker-check.result != 'success' || needs.secret-scan.result != 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/checkout@v4

      # 現在のCI実行から失敗ログを取得し、取得できない場合はワークフロー全体のログを取得
      - name: Collect failed logs
        if: ${{ (needs.python-check.result != 'success' || needs.docker-check.result != 'success' || needs.secret-scan.result != 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if gh run view "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --log-failed > failed-logs.txt; then
            exit 0
          fi

          if gh run view "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --log > failed-logs.txt; then
            exit 0
          fi

          echo "Failed logs could not be collected." > failed-logs.txt
        env:
          GH_TOKEN: ${{ github.token }}

      # AIに渡す入力を小さくし、エラー周辺に絞るためログ末尾だけを残す
      - name: Trim failed logs
        if: ${{ (needs.python-check.result != 'success' || needs.docker-check.result != 'success' || needs.secret-scan.result != 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          tail -n 400 failed-logs.txt > trimmed-failed-logs.txt

      # GitHub-hosted Runner上でCopilot CLIをインストールするためにNode.jsを準備
      - name: Set up Node
        if: ${{ (needs.python-check.result != 'success' || needs.docker-check.result != 'success' || needs.secret-scan.result != 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/setup-node@v6

      # actions/ai-inferenceが利用するCopilot CLIをインストール
      - name: Install Copilot CLI
        if: ${{ (needs.python-check.result != 'success' || needs.docker-check.result != 'success' || needs.secret-scan.result != 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: npm install -g @github/copilot

      # ワークフロー情報と失敗ログをもとに、AIでCI失敗サマリを生成
      - name: Generate AI summary
        if: ${{ (needs.python-check.result != 'success' || needs.docker-check.result != 'success' || needs.secret-scan.result != 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        id: ai_summary
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/ci-failure-summary_prompt.yml
          input: |
            workflow_name: ${{ github.workflow }}
            workflow_result: failure
            branch_name: ${{ github.ref_name }}
            commit_sha: ${{ github.sha }}
            run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          file_input: |
            failed_logs: trimmed-failed-logs.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # AIが生成したMarkdownをGitHub ActionsのJob Summaryに出力
      - name: Write AI failure summary
        if: ${{ (needs.python-check.result != 'success' || needs.docker-check.result != 'success' || needs.secret-scan.result != 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          cat "${{ steps.ai_summary.outputs.response-file }}" >> "$GITHUB_STEP_SUMMARY"
