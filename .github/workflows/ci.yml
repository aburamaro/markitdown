name: CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  # Pythonによるコードチェック、フォーマットチェック、型チェック、ユニットテストを実行するジョブ
  python-check:
    name: Python Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Unit test
        run: pytest

  # DockerfileのLint、ビルド、起動テストを実行するジョブ
  docker-check:
    name: Docker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: .devcontainer/Dockerfile
          failure-threshold: error

      - name: Build Docker image
        run: docker build -t markitdown-ci -f .devcontainer/Dockerfile .

      - name: Smoke test Docker image
        run: docker run --rm markitdown-ci python src/main.py --help

  # Gitleaksを使用して秘密情報のスキャンを実行するジョブ
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # コミット履歴全体をフェッチ

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
